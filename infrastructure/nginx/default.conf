# Containers loaded from conf.d are included inside the http block, so this map is valid here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 2g;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        # WebSocket upgrade for /api/v1/ws/events; REST requests are unaffected.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /health/live { proxy_pass http://backend:8000; }
    location /metrics { return 404; }
    location /health/ready { return 404; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
